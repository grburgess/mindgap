[package]
name = "mindtop"
version = "0.1.0"
edition = "2021"
description = "top-like TUI for the mindgap knowledge graph"
license = "MIT"

[[bin]]
name = "mindtop"
path = "src/main.rs"

[lib]
name = "mindtop"
path = "src/lib.rs"

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
rusqlite = { version = "0.40", features = ["bundled"] }
serde_json = "1"
chrono = "0.4"
